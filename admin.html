<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin – Raumbuchung Groß Leine</title>
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: "Inter", sans-serif;
        background: #f5f8fb;
        color: #1d2a33;
      }
      .admin-shell {
        max-width: 1280px;
        margin: 0 auto;
        padding: 32px 20px 60px;
      }
      .topbar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        margin-bottom: 24px;
      }
      .card {
        background: #fff;
        border: 1px solid #dfe8ee;
        border-radius: 18px;
        box-shadow: 0 8px 20px rgba(20, 40, 58, 0.04);
      }
      .login-card {
        max-width: 460px;
        margin: 40px auto;
        padding: 28px;
      }
      form {
        display: grid;
        gap: 16px;
      }
      label {
        display: grid;
        gap: 8px;
        font-weight: 600;
      }
      input, select {
        border: 1px solid #dfe8ee;
        border-radius: 12px;
        padding: 12px 14px;
        font-size: 1rem;
      }
      .button {
        border: none;
        border-radius: 12px;
        padding: 12px 16px;
        font-weight: 700;
        cursor: pointer;
      }
      .button-primary {
        background: linear-gradient(135deg, #0e5a8a, #0a3d65);
        color: #fff;
      }
      .button-secondary {
        background: #eef5fa;
        color: #123653;
      }
      .hidden { display: none !important; }
      .admin-panel { display: none; }
      .toolbar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        flex-wrap: wrap;
        margin-bottom: 18px;
      }
      .table-wrap { overflow-x: auto; }
      table {
        width: 100%;
        border-collapse: collapse;
      }
      th, td {
        text-align: left;
        padding: 12px 10px;
        border-bottom: 1px solid #edf2f5;
        vertical-align: top;
      }
      th {
        background: #f7fafc;
        font-size: 0.8rem;
        text-transform: uppercase;
        letter-spacing: 0.05em;
      }
      .status-pill {
        display: inline-block;
        border-radius: 999px;
        padding: 4px 10px;
        font-size: 0.7rem;
        font-weight: 700;
      }
      .status-free { background: #ebf9f0; color: #1c7a49; }
      .status-pending { background: #fff5dd; color: #9a6200; }
      .actions {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
      }
      .inline-form {
        margin-top: 20px;
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 14px;
      }
      @media (max-width: 760px) {
        .inline-form { grid-template-columns: 1fr; }
      }
    </style>
  </head>
  <body>
    <div class="admin-shell">
      <div id="loginView" class="card login-card">
        <h2>Admin-Anmeldung</h2>
        <form id="loginForm">
          <label>
            Benutzername
            <input type="text" name="username" value="admin" required />
          </label>
          <label>
            Passwort
            <input type="password" name="password" value="admin123" required />
          </label>
          <button class="button button-primary" type="submit">Anmelden</button>
        </form>
      </div>

      <div id="adminPanel" class="admin-panel">
        <div class="topbar">
          <h2>Verwaltung der Raumbuchungen</h2>
          <button id="logoutBtn" class="button button-secondary" type="button">Abmelden</button>
        </div>

        <div class="toolbar card" style="padding: 16px 18px; margin-bottom: 18px;">
          <div><strong>Export:</strong> <a href="/api/admin/bookings/export/csv" target="_blank">CSV herunterladen</a></div>
          <button id="refreshBtn" class="button button-secondary" type="button">Aktualisieren</button>
        </div>

        <div class="table-wrap card" style="padding: 0 0 12px;">
          <table>
            <thead>
              <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Raum</th>
                <th>Datum</th>
                <th>Preis</th>
                <th>Status</th>
                <th>Aktionen</th>
              </tr>
            </thead>
            <tbody id="bookingTableBody"></tbody>
          </table>
        </div>

        <div class="card" style="margin-top: 28px; padding: 20px;">
          <h3>Buchung bearbeiten</h3>
          <form id="editBookingForm" class="inline-form">
            <input type="hidden" name="id" />
            <label>
              Name
              <input type="text" name="name" required />
            </label>
            <label>
              Raum
              <select name="room">
                <option value="Sitzungsraum">Sitzungsraum</option>
                <option value="Großer Raum">Großer Raum</option>
              </select>
            </label>
            <label>
              Datum
              <input type="date" name="date" required />
            </label>
            <label>
              Tage
              <input type="number" name="days" min="1" max="3" value="1" required />
            </label>
            <label>
              Zweck
              <input type="text" name="purpose" required />
            </label>
            <label>
              Uhrzeit
              <input type="text" name="time" required />
            </label>
            <label>
              Status
              <select name="status">
                <option value="neu">neu</option>
                <option value="bestätigt">bestätigt</option>
                <option value="storniert">storniert</option>
              </select>
            </label>
            <label>
              Küche
              <select name="kitchen">
                <option value="0">Nein</option>
                <option value="1">Ja</option>
              </select>
            </label>
            <label>
              Preis (€)
              <input type="number" step="0.01" name="price" required />
            </label>
            <div style="display:flex; align-items:flex-end; gap: 10px;">
              <button class="button button-primary" type="submit">Speichern</button>
              <button id="cancelEditBtn" type="button" class="button button-secondary">Abbrechen</button>
            </div>
          </form>
        </div>
      </div>
    </div>

    <script>
      const loginView = document.getElementById('loginView');
      const adminPanel = document.getElementById('adminPanel');
      const loginForm = document.getElementById('loginForm');
      const bookingTableBody = document.getElementById('bookingTableBody');
      const editBookingForm = document.getElementById('editBookingForm');
      const refreshBtn = document.getElementById('refreshBtn');
      const logoutBtn = document.getElementById('logoutBtn');

      function getToken() {
        return localStorage.getItem('raumbuchung_admin_token');
      }

      function setToken(token) {
        localStorage.setItem('raumbuchung_admin_token', token || '');
      }

      function apiFetch(url, options = {}) {
        const token = getToken();
        return fetch(url, {
          ...options,
          headers: {
            'Content-Type': 'application/json',
            ...(token ? { Authorization: `Bearer ${token}` } : {}),
            ...(options.headers || {}),
          },
        }).then(async (response) => {
          const data = await response.json().catch(() => ({}));
          if (!response.ok) {
            throw new Error(data.message || 'Anfrage fehlgeschlagen');
          }
          return data;
        });
      }

      function renderStatus(status) {
        const map = {
          neu: 'status-pending',
          bestätigt: 'status-free',
          storniert: 'status-pending',
        };
        const label = status || 'neu';
        return `<span class="status-pill ${map[label] || ''}">${label}</span>`;
      }

      function renderBookings(bookings) {
        if (!bookings.length) {
          bookingTableBody.innerHTML = '<tr><td colspan="7">Keine Buchungen vorhanden.</td></tr>';
          return;
        }

        bookingTableBody.innerHTML = bookings.map((booking) => `
          <tr>
            <td>${booking.id}</td>
            <td>${booking.name}</td>
            <td>${booking.room}</td>
            <td>${booking.date}</td>
            <td>${Number(booking.price || 0).toFixed(2).replace('.', ',')} €</td>
            <td>${renderStatus(booking.status)}</td>
            <td class="actions">
              <button class="button button-secondary" type="button" data-edit="${booking.id}">Bearbeiten</button>
              <button class="button button-secondary" type="button" data-delete="${booking.id}">Löschen</button>
            </td>
          </tr>
        `).join('');

        document.querySelectorAll('[data-edit]').forEach((btn) => {
          btn.addEventListener('click', async () => {
            const id = Number(btn.getAttribute('data-edit'));
            const booking = await apiFetch(`/api/admin/bookings/${id}`);
            Object.entries(booking).forEach(([key, value]) => {
              const field = editBookingForm.elements.namedItem(key);
              if (!field) return;
              if (field.type === 'number') field.value = value ?? '';
              else if (field.type === 'date') field.value = value || '';
              else if (field.tagName === 'SELECT') {
                field.value = String(value);
              } else {
                field.value = value ?? '';
              }
            });
          });
        });

        document.querySelectorAll('[data-delete]').forEach((btn) => {
          btn.addEventListener('click', async () => {
            const id = Number(btn.getAttribute('data-delete'));
            if (!confirm('Buchung wirklich löschen?')) return;
            await apiFetch(`/api/admin/bookings/${id}`, { method: 'DELETE' });
            loadBookings();
          });
        });
      }

      async function loadBookings() {
        try {
          const bookings = await apiFetch('/api/admin/bookings');
          renderBookings(bookings);
        } catch (error) {
          alert(error.message);
          logout();
        }
      }

      function showAdminPanel() {
        loginView.classList.add('hidden');
        adminPanel.style.display = 'block';
      }

      function showLoginPanel() {
        adminPanel.style.display = 'none';
        loginView.classList.remove('hidden');
      }

      function logout() {
        setToken('');
        showLoginPanel();
      }

      loginForm.addEventListener('submit', async (event) => {
        event.preventDefault();
        const formData = new FormData(loginForm);
        const body = {
          username: formData.get('username'),
          password: formData.get('password'),
        };

        try {
          const result = await fetch('/api/auth/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(body),
          }).then(async (res) => {
            const data = await res.json();
            if (!res.ok) throw new Error(data.message || 'Login fehlgeschlagen');
            return data;
          });

          setToken(result.token);
          showAdminPanel();
          loadBookings();
        } catch (error) {
          alert(error.message);
        }
      });

      refreshBtn.addEventListener('click', loadBookings);
      logoutBtn.addEventListener('click', logout);

      editBookingForm.addEventListener('submit', async (event) => {
        event.preventDefault();
        const formData = new FormData(editBookingForm);
        const id = formData.get('id');
        const body = {
          name: formData.get('name'),
          room: formData.get('room'),
          date: formData.get('date'),
          days: Number(formData.get('days') || 1),
          purpose: formData.get('purpose'),
          time: formData.get('time'),
          status: formData.get('status'),
          kitchen: Number(formData.get('kitchen') || 0) === 1,
          price: Number(formData.get('price') || 0),
        };

        try {
          await apiFetch(`/api/admin/bookings/${id}`, {
            method: 'PUT',
            body: JSON.stringify(body),
          });
          editBookingForm.reset();
          loadBookings();
        } catch (error) {
          alert(error.message);
        }
      });

      document.getElementById('cancelEditBtn').addEventListener('click', () => editBookingForm.reset());

      if (getToken()) {
        showAdminPanel();
        loadBookings();
      }
    </script>
  </body>
</html>
